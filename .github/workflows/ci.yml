name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same version as the Lambda base image.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=src/api --cov-report=term-missing
      - run: cfn-lint deployment/*.template
      # shellcheck is preinstalled on the GitHub-hosted Ubuntu runners.
      - run: shellcheck scripts/*.sh

  # Builds the deployed Lambda image (arm64) without pushing it, so a broken base image,
  # adapter tag or dependency install fails here rather than at deploy time.
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file src/Dockerfile src/
