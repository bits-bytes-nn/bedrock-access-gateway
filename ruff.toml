line-length = 120
indent-width = 4
target-version = "py312"

exclude = [
    ".venv",
    ".vscode",
]

[lint]
# B catches bug-prone patterns such as raising without "from" inside "except";
# G keeps log messages lazily formatted.
select = ["E", "F", "I", "B", "G", "UP"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["api"]

[format]
# use double quotes for strings.
quote-style = "double"
