line-length = 120
indent-width = 4
target-version = "py312"

exclude = [
    ".venv",
    ".vscode",
]

[lint]
# B catches bug-prone patterns such as raising without "from" inside "except".
select = ["E", "F", "I", "B"]
ignore = [
    "E501",
    "C901",
    # Optional hook methods on the abstract base classes are intentionally empty.
    "B027",
]

[lint.isort]
known-first-party = ["api"]

[format]
# use double quotes for strings.
quote-style = "double"
